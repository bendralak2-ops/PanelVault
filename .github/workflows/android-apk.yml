name: Build PanelVault Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify development build
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb pull /sdcard/Download/panelvault-library.png library.png
            adb pull /sdcard/Download/panelvault-drawer.png drawer.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PanelVault-device-verification
          path: |
            library.png
            drawer.png
            app/build/reports/androidTests/
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      PANELVAULT_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore permanent signing identity
        env:
          KEY_BASE64: ${{ secrets.PANELVAULT_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.PANELVAULT_KEY_PASSWORD }}
        run: |
          test -n "$KEY_BASE64" && test -n "$KEY_PASSWORD" || { echo "Configure permanent PanelVault signing secrets before release"; exit 1; }
          echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/panelvault.p12"
      - name: Build signed release
        env:
          PANELVAULT_KEYSTORE: ${{ runner.temp }}/panelvault.p12
          PANELVAULT_KEY_PASSWORD: ${{ secrets.PANELVAULT_KEY_PASSWORD }}
        run: PANELVAULT_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER)) gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify signing certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee signing-report.txt
          fingerprint=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signing-report.txt)
          test "$fingerprint" = "$(tr -d '\r\n' < signing-cert.sha256)"
      - uses: actions/upload-artifact@v4
        with:
          name: PanelVault-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/panelvault.p12"
